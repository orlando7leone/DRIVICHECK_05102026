    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22background_color%22%3A%22%23ffffff%22%2C%22dir%22%3A%22ltr%22%2C%22display%22%3A%22standalone%22%2C%22name%22%3A%22DriveCheck%22%2C%22orientation%22%3A%22any%22%2C%22scope%22%3A%22%2F%22%2C%22short_name%22%3A%22DriveCheck%22%2C%22start_url%22%3A%22%2F%22%2C%22theme_color%22%3A%22%23ffffff%22%2C%22id%22%3A%22DriveCheck%22%2C%22lang%22%3A%22it%22%7D">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Svuota immediatamente la cache del browser e i vecchi Service Worker
      // per garantire che il PC riceva sempre l'ultimissima grafica aggiornata
      try {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister();
            }
          });
        }
      } catch (e) {
        console.warn('Cache cleanup error:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
